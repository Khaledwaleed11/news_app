  name: news_app
  description: "A modern Flutter news application for browsing, searching, and saving news articles."
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.10.7

  dependencies:
    flutter:
      sdk: flutter

    cupertino_icons: ^1.0.8
    http: ^1.6.0
    url_launcher: ^6.3.2
    share_plus: ^12.0.1
    hive: ^2.2.3
    hive_flutter: ^1.1.0

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true
